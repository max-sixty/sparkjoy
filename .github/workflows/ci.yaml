name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so each Claude Code release is tested the day it ships.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: mod (Claude Code ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest channel's release, and the stable channel's, the oldest
        # that auto-updating users run, which refuses a call only newer
        # releases take.
        channel: [latest, stable]
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global @anthropic-ai/claude-code@${{ matrix.channel }}
      - run: claude --version && claude plugin validate . && claude plugin test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version tag.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pytest tests
